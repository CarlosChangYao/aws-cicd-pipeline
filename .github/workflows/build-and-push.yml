name: Build and Push to ECR

# ─────────────────────────────────────────────────────────────
# 關 2：把關 1 的手動流程自動化
#
#   關 1（人工）                        關 2（自動）
#   ─────────────────                  ─────────────────
#   自己記得要跑測試             →      push 就自動跑，不過不准部署
#   自己打 docker build          →      自動執行
#   自己想版本號                 →      自動用 git commit 與流水號
#   自己 docker push             →      自動推送
#   本機要有 AWS 金鑰            →      OIDC 換臨時憑證，零金鑰
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  # 允許在 GitHub 網頁上手動觸發，方便測試
  workflow_dispatch:

# 這段是 OIDC 的關鍵：沒有 id-token: write，
# GitHub 就不會為這次執行簽發身分權杖，AWS 那邊也就換不到憑證。
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: nkc202-cicd-app
  AWS_ROLE_ARN: arn:aws:iam::265311920986:role/nkc202-github-actions

jobs:
  # ── 第一關：測試 ────────────────────────────────────────────
  # 刻意獨立成一個 job。測試不過，下面的 build 完全不會執行。
  # 這就是「自動化的內控關卡」——不靠人記得檢查，機器強制執行。
  test:
    name: 執行測試
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r app/requirements.txt pytest

      - name: 跑測試
        working-directory: app
        run: pytest -v

  # ── 第二關：打包並推送 ──────────────────────────────────────
  build-and-push:
    name: 建置並推送映像檔
    runs-on: ubuntu-latest
    # needs 是關鍵：test 沒過，這個 job 直接不執行
    needs: test

    # 把版本資訊往外送，讓下游的部署 job 知道要部署哪一個映像檔。
    # 這是關 3 能「精準部署剛剛建好的那一版」的關鍵——
    # 不是模糊地部署 latest，而是明確指定 commit SHA。
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha_short: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 產生版本資訊
        id: meta
        run: |
          # 版本號完全由機器決定，人不能介入：
          #   run_number 是這個 workflow 的第幾次執行（GitHub 自動遞增）
          #   sha 是這次 commit 的識別碼
          # 關 0 時這一格只能填「none-manual-deploy」，現在它一定正確。
          echo "version=v1.2.$(( ${{ github.run_number }} ))-ci" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "built_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 除錯：印出 GitHub 實際送出的身分內容
        # OIDC 權杖是一段 JWT，中間那段是 base64 編碼的 claims（宣告）。
        # AWS 就是拿這裡面的 sub 和 aud 去比對信任政策。
        # 印出來才知道到底是哪一項對不上，不用猜。
        run: |
          TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ('iss', 'aud', 'sub', 'repository', 'repository_owner', 'ref'):
              print(f'{k:20} = {claims.get(k)}')
          PY

      - name: 以 OIDC 取得 AWS 臨時憑證
        # 這一步不需要任何 secret。GitHub 出示身分權杖，
        # AWS 驗證「確實來自這個 repo」後才發憑證，有效期 1 小時。
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 確認取得的身分
        run: aws sts get-caller-identity

      - name: 登入 ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 建置並推送映像檔
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha_short }}
          BUILT_AT: ${{ steps.meta.outputs.built_at }}
        run: |
          # Actions 的執行環境本來就是 x86_64，
          # 不需要像本機 Mac 那樣加 --platform 做跨架構模擬。
          # --provenance=false 是關 1 學到的：避免產出 OCI Image Index
          # 導致 ECR 漏洞掃描失效。
          docker build \
            --provenance=false --sbom=false \
            --build-arg BUILD_VERSION="$VERSION" \
            --build-arg GIT_COMMIT="$SHA" \
            --build-arg DEPLOYED_AT="$BUILT_AT" \
            -t "$REGISTRY/$ECR_REPOSITORY:$SHA" \
            -t "$REGISTRY/$ECR_REPOSITORY:$VERSION" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            app/

          # 三個 tag 各有用途：
          #   :$SHA     → 精確對應某次 commit，回滾時指定這個
          #   :$VERSION → 人類看得懂的版本號
          #   :latest   → 部署時預設拉這個
          docker push "$REGISTRY/$ECR_REPOSITORY:$SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:$VERSION"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: 輸出本次建置摘要
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha_short }}
        run: |
          {
            echo "### 建置完成"
            echo ""
            echo "| 項目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`$VERSION\` |"
            echo "| Git Commit | \`$SHA\` |"
            echo "| 觸發者 | ${{ github.actor }} |"
            echo "| 觸發原因 | ${{ github.event_name }} |"
          } >> $GITHUB_STEP_SUMMARY

  # ── 第三關：自動部署到 EC2 ──────────────────────────────────
  # 關 2 做完後，映像檔進了 ECR，但 EC2 上跑的還是舊版——
  # 因為沒有任何機制通知它。這個 job 就是補上那個斷點。
  #
  # 設計重點：透過 SSM Run Command 下令，而非 SSH。
  #   → EC2 不需要開任何 inbound port
  #   → GitHub 不需要保管任何主機金鑰
  #   → 每次部署都留下 CloudTrail 稽核軌跡
  deploy:
    name: 部署到 EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      INSTANCE_ID: i-0937ad0e32c5fedca
      IMAGE_TAG: ${{ needs.build-and-push.outputs.sha_short }}
      APP_URL: http://52.199.107.190

    steps:
      - name: 以 OIDC 取得 AWS 臨時憑證
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 透過 SSM 指示 EC2 拉取新映像檔並重啟容器
        id: send
        run: |
          REGISTRY="265311920986.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "準備部署：$IMAGE"

          # 刻意指定 commit SHA 標籤而非 latest。
          # 這樣「這次部署的是哪一版程式碼」是確定的，不會因為
          # latest 被後續建置覆蓋而失去對應關係——回滾時也才有依據。
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG by GitHub Actions run ${{ github.run_number }}" \
            --parameters "commands=[
              \"set -e\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $IMAGE\",
              \"docker rm -f nkc202app 2>/dev/null || true\",
              \"docker run -d --name nkc202app --restart always -p 80:8080 $IMAGE\",
              \"sleep 5\",
              \"docker ps --filter name=nkc202app --format '{{.Status}} | {{.Image}}'\"
            ]" \
            --query 'Command.CommandId' --output text)

          echo "SSM 指令已送出：$CMD_ID"
          echo "cmd_id=$CMD_ID" >> $GITHUB_OUTPUT

      - name: 等待部署完成並取回執行結果
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.cmd_id }}" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "第 $i 次查詢：$STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.send.outputs.cmd_id }}" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
            sleep 6
          done

          echo "── EC2 上的執行輸出 ──"
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.cmd_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

      - name: 從公開網址驗證部署結果
        # 部署成功不等於服務正常。這一步從網際網路實際打一次，
        # 並確認回傳的版本號就是這次建置的版本——形成閉環驗證。
        run: |
          for i in $(seq 1 10); do
            BODY=$(curl -s --max-time 10 "$APP_URL/healthz" || true)
            echo "第 $i 次健康檢查：$BODY"
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "$BODY" > /tmp/health.json
              break
            fi
            sleep 5
          done

          grep -q '"status":"ok"' /tmp/health.json \
            || { echo "❌ 健康檢查未通過"; exit 1; }

          echo "✅ 線上服務正常"
          curl -s "$APP_URL/" | grep -oE 'class="v">[^<]+' | sed 's/class="v">/線上版本：/'

      - name: 輸出部署摘要
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "| 項目 | 值 |"
            echo "|---|---|"
            echo "| 部署的映像檔 | \`$IMAGE_TAG\` |"
            echo "| 目標主機 | \`$INSTANCE_ID\` |"
            echo "| 部署方式 | SSM Run Command（未使用 SSH） |"
            echo "| 線上網址 | $APP_URL |"
          } >> $GITHUB_STEP_SUMMARY
